<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея зображень</title>
  <link rel="icon" href="/images/rocket.svg" type="image/svg+xml">
  <style>
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
    }
    h1 {
      text-align: center;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }
    figure {
      margin: 0;
      padding: 16px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    figure img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    figcaption {
      margin-top: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Галерея зображень</h1>

  <div class="gallery">
    <figure>
      <img src="/images/landscape.jpg" alt="Гірський пейзаж на заході сонця" width="800" height="500">
      <figcaption>JPG: пейзаж</figcaption>
    </figure>

    <figure>
      <img src="/images/logo.png" alt="Жовта зірка в синьому колі" width="400" height="400">
      <figcaption>PNG: логотип з прозорим фоном</figcaption>
    </figure>

    <figure>
      <img src="/images/ball.gif" alt="Анімація м'яча, що підстрибує" width="300" height="300">
      <figcaption>GIF: анімація</figcaption>
    </figure>

    <figure>
      <img src="/images/rocket.svg" alt="Векторна ракета в космосі" width="200" height="200">
      <figcaption>SVG: векторна графіка</figcaption>
    </figure>
  </div>
</body>
</html>
